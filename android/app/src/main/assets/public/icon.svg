<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Background / Rounded Squircle for Android -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle mathematical grid / Peano circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>

  <!-- Peano Natural Number Symbol: Double-struck ℕ with Lean 4 Turnstile ⊢ -->
  <g filter="url(#shadow)" transform="translate(10, 0)">
    <!-- Left bar of N -->
    <path d="M 160 135 L 188 135 L 188 377 L 160 377 Z" fill="url(#glow)"/>
    <path d="M 188 135 L 204 135 L 204 377 L 188 377 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Diagonal stroke -->
    <path d="M 198 140 L 312 370 L 332 370 L 218 140 Z" fill="url(#glow)"/>
    
    <!-- Right bar of N -->
    <path d="M 314 135 L 342 135 L 342 377 L 314 377 Z" fill="url(#glow)"/>
    
    <!-- Turnstile symbol (⊢ Lean Proof Goal) overlay badge -->
    <g transform="translate(320, 290)">
      <circle cx="55" cy="55" r="50" fill="#0f172a" stroke="url(#accent)" stroke-width="4"/>
      <!-- Turnstile ⊢ -->
      <line x1="40" y1="35" x2="40" y2="75" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
      <line x1="40" y1="55" x2="72" y2="55" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Lean 4 tag text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#a5b4fc" letter-spacing="4" text-anchor="middle">LEAN 4 • NNG</text>
</svg>
